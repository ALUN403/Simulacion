<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evasión de Colisiones entre Múltiples Enjambres</title>
<style>
  :root {
    --bg-app: #141416;
    --bg-card: #222126;
    --bg-canvas: #141518;
    --bg-pill: #2c2b31;
    --border-amber: rgba(243, 156, 18, 0.35);
    --border-subtle: #333238;
    --text-primary: #f1f3f5;
    --text-secondary: #9aa0a6;
    --accent-amber: #f39c12;
    --accent-amber-hover: #e67e22;
    --swarm-blue: #8ab4f8;
    --swarm-magenta: #f48fb1;
    --swarm-green: #81c995;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
  }

  body {
    background-color: var(--bg-app);
    color: var(--text-primary);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    min-height: 100vh;
  }

  .app-shell {
    width: 100%;
    max-width: 1240px;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 16px;
    align-items: stretch;
  }

  /* Panel Izquierdo: Parámetros */
  .controls-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-amber);
    border-radius: 14px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    height: 540px;
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    padding-bottom: 14px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border-amber);
  }

  .header-title {
    font-size: 1.08rem;
    font-weight: 500;
    color: var(--accent-amber);
    line-height: 1.3;
    letter-spacing: -0.01em;
  }

  .grip-icon {
    display: grid;
    grid-template-columns: repeat(2, 3px);
    gap: 3px;
    opacity: 0.7;
    margin-top: 4px;
    flex-shrink: 0;
  }

  .grip-icon span {
    width: 3px;
    height: 3px;
    background-color: var(--accent-amber);
    border-radius: 50%;
  }

  .sliders-stack {
    display: flex;
    flex-direction: column;
    gap: 26px;
  }

  .slider-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }

  .slider-label {
    font-size: 0.92rem;
    font-weight: 500;
    color: var(--text-primary);
  }

  .slider-sublabel {
    display: block;
    font-size: 0.75rem;
    color: var(--text-secondary);
    line-height: 1.35;
    margin-bottom: 10px;
  }

  .value-display {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }

  /* Sliders personalizados color ámbar */
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 5px;
    background: #3a3940;
    border-radius: 999px;
    outline: none;
    cursor: pointer;
    margin-top: 4px;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 15px;
    height: 15px;
    background: var(--accent-amber);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 0 2px rgba(243, 156, 18, 0.25);
    transition: transform 0.12s ease;
  }

  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.12);
  }

  input[type="range"]::-moz-range-thumb {
    width: 15px;
    height: 15px;
    background: var(--accent-amber);
    border: none;
    border-radius: 50%;
    cursor: pointer;
  }

  .action-buttons {
    margin-top: auto;
    display: flex;
    flex-direction: column;
  }

  .btn-action {
    width: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 11px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border-subtle);
    background-color: var(--bg-pill);
    color: var(--text-primary);
    transition: background-color 0.15s ease;
  }

  .btn-action.primary {
    background-color: var(--accent-amber);
    border-color: var(--accent-amber);
    color: #121214;
  }

  .btn-action.primary:hover {
    background-color: var(--accent-amber-hover);
  }

  /* Panel Derecho: Lienzo de Simulación */
  .canvas-card {
    background-color: var(--bg-canvas);
    border: 1px solid var(--border-amber);
    border-radius: 14px;
    overflow: hidden;
    height: 540px;
    position: relative;
    cursor: crosshair;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  @media (max-width: 840px) {
    .app-shell {
      grid-template-columns: 1fr;
    }
    .controls-card {
      height: auto;
    }
    .action-buttons {
      margin-top: 24px;
    }
    .canvas-card {
      height: 400px;
    }
  }
</style>
</head>
<body>

<div class="app-shell">
  <!-- Panel Izquierdo: Parámetros -->
  <aside class="controls-card">
    <div class="panel-header">
      <div class="header-title">Evasión de Colisiones entre Múltiples Enjambres</div>
      <div class="grip-icon" aria-hidden="true">
        <span></span><span></span>
        <span></span><span></span>
        <span></span><span></span>
      </div>
    </div>

    <div class="sliders-stack">
      <div>
        <div class="slider-header">
          <span class="slider-label">Robots por Enjambre (N)</span>
          <span class="value-display" id="nBadge">2</span>
        </div>
        <input type="range" id="nSlider" min="1" max="5" step="1" value="2">
      </div>

      <div>
        <div class="slider-header">
          <span class="slider-label">Rango Sensor Difuso (r<sub>sens</sub>)</span>
          <span class="value-display" id="rBadge">1.5 m</span>
        </div>
        <span class="slider-sublabel">Distancia umbral para activar la evasión difusa.</span>
        <input type="range" id="rSlider" min="1.5" max="2.5" step="0.1" value="1.5">
      </div>
    </div>

    <div class="action-buttons">
      <button class="btn-action primary" id="resetBtn">Reiniciar</button>
    </div>
  </aside>

  <!-- Panel Derecho: Lienzo de Simulación -->
  <main class="canvas-card" id="canvasBox">
    <canvas id="simCanvas"></canvas>
  </main>
</div>

<script>
// ============================================================================
// 1. FUNCIONES DE PERTENENCIA DIFUSA
// ============================================================================
function trimf(x, a, b, c) {
  return Math.max(Math.min((x - a) / (b - a + 1e-6), (c - x) / (c - b + 1e-6)), 0);
}

function trapmf(x, a, b, c, d) {
  return Math.max(Math.min(Math.min((x - a) / (b - a + 1e-6), 1), (d - x) / (d - c + 1e-6)), 0);
}

function wrapToPi(angle) {
  while (angle > Math.PI) angle -= 2 * Math.PI;
  while (angle < -Math.PI) angle += 2 * Math.PI;
  return angle;
}

// ============================================================================
// 2. SISTEMA DE INFERENCIA MAMDANI (Escalado dinámicamente a rSens: 1.5 - 2.5 m)
// ============================================================================
function fisMamdaniEvasion(d, theta, rSens) {
  const muDCritica = trapmf(d, 0, 0, 0.45 * rSens, 0.70 * rSens);
  const muDCerca   = trimf(d, 0.50 * rSens, 0.75 * rSens, 0.95 * rSens);
  const muDLejos   = trapmf(d, 0.85 * rSens, 0.98 * rSens, rSens + 1, rSens + 1);

  const muThIzq     = trapmf(theta, 0.2, 0.6, Math.PI, Math.PI);
  const muThFrontal = trimf(theta, -0.5, 0, 0.5);
  const muThDer     = trapmf(theta, -Math.PI, -Math.PI, -0.6, -0.2);

  // Reglas difusas
  const w1 = Math.min(muDCritica, muThFrontal);
  const w2 = Math.min(muDCritica, muThIzq);
  const w3 = Math.min(muDCritica, muThDer);
  const w4 = Math.min(muDCerca, muThFrontal);
  const w5 = Math.min(muDCerca, Math.max(muThIzq, muThDer));
  const w6 = muDLejos;

  // Defuzzificación por centroide (Magnitud)
  let numMag = 0, denMag = 0;
  const steps = 36;
  for (let s = 0; s <= steps; s++) {
    const u = (8 * s) / steps;
    const agg = Math.max(
      Math.min(w6, trimf(u, -0.5, 0, 1.0)),
      Math.min(w5, trimf(u, 0.5, 2.0, 3.5)),
      Math.min(w4, trimf(u, 2.5, 4.5, 6.5)),
      Math.min(Math.max(w1, w2, w3), trapmf(u, 5.0, 6.5, 8.0, 8.0))
    );
    numMag += u * agg;
    denMag += agg;
  }
  const magSalida = denMag === 0 ? 0 : numMag / denMag;

  // Defuzzificación por centroide (Ángulo de desvío tangencial)
  let numAng = 0, denAng = 0;
  for (let s = 0; s <= steps; s++) {
    const u = -Math.PI / 2 + (Math.PI * s) / steps;
    const agg = Math.max(
      Math.min(Math.max(w1, w2), trimf(u, -Math.PI / 2, -Math.PI / 3, -Math.PI / 6)),
      Math.min(w4, trimf(u, -Math.PI / 3, -Math.PI / 6, 0)),
      Math.min(Math.max(w5, w6), trimf(u, -0.1, 0, 0.1)),
      Math.min(w3, trimf(u, 0, Math.PI / 6, Math.PI / 3))
    );
    numAng += u * agg;
    denAng += agg;
  }
  const angSalida = denAng === 0 ? 0 : numAng / denAng;

  return { mag: magSalida, ang: angSalida };
}

// ============================================================================
// 3. SISTEMA TAKAGI-SUGENO (Fuerzas internas y navegación al objetivo)
// ============================================================================
function calcularFuerzasAgente(agent, ownSwarm, allSwarms, params) {
  const { dFormacion, rSensor } = params;

  // A. Atracción al objetivo (T-S de primer orden)
  const dxG = agent.goal.x - agent.x;
  const dyG = agent.goal.y - agent.y;
  const distGoal = Math.hypot(dxG, dyG);
  const dirGx = dxG / (distGoal + 1e-6);
  const dirGy = dyG / (distGoal + 1e-6);

  const muGCerca = trimf(distGoal, -0.1, 0, 2.2);
  const muGLejos = trapmf(distGoal, 1.4, 2.8, 100, 100);

  const fTsCerca = 1.3 * distGoal;
  const fTsLejos = 0.12 * distGoal + 2.1;
  const magFObj = (muGCerca * fTsCerca + muGLejos * fTsLejos) / (muGCerca + muGLejos + 1e-6);

  const fObjX = magFObj * dirGx;
  const fObjY = magFObj * dirGy;

  // B. Cohesión y separación interna (T-S de primer orden)
  let fIntX = 0, fIntY = 0;
  for (const mate of ownSwarm.agents) {
    if (mate === agent) continue;
    const dx = mate.x - agent.x;
    const dy = mate.y - agent.y;
    const d = Math.hypot(dx, dy);
    const errD = d - dFormacion;

    const muMuyCerca = trapmf(errD, -10, -10, -0.35, 0);
    const muOptimo   = trimf(errD, -0.35, 0, 0.55);
    const muLejos    = trapmf(errD, 0.2, 0.9, 20, 20);

    const uRep = 3.8 * errD;
    const uOpt = 0.2 * errD;
    const uCoh = 0.9 * errD + 0.35;

    const magInt = (muMuyCerca * uRep + muOptimo * uOpt + muLejos * uCoh) /
                   (muMuyCerca + muOptimo + muLejos + 1e-6);

    fIntX += magInt * (dx / (d + 1e-6));
    fIntY += magInt * (dy / (d + 1e-6));
  }

  // C. Evasión inter-enjambre (Mamdani)
  let fColX = 0, fColY = 0;

  for (const otherSwarm of allSwarms) {
    if (otherSwarm.id === ownSwarm.id) continue;
    for (const intruder of otherSwarm.agents) {
      const dx = intruder.x - agent.x;
      const dy = intruder.y - agent.y;
      const d = Math.hypot(dx, dy);

      if (d < rSensor) {
        const vNorm = Math.hypot(agent.vx, agent.vy);
        const angV = vNorm > 0.05 ? Math.atan2(agent.vy, agent.vx) : Math.atan2(dirGy, dirGx);
        const angK = Math.atan2(dy, dx);
        const thetaRel = wrapToPi(angK - angV);

        const { mag, ang } = fisMamdaniEvasion(d, thetaRel, rSensor);

        const repX = -dx / (d + 1e-6);
        const repY = -dy / (d + 1e-6);
        const cosA = Math.cos(ang);
        const sinA = Math.sin(ang);

        fColX += mag * (repX * cosA - repY * sinA);
        fColY += mag * (repX * sinA + repY * cosA);
      }
    }
  }

  const magCol = Math.hypot(fColX, fColY);
  const factorAtenuacion = 1 / (1 + 0.45 * magCol);

  return {
    fx: fObjX + factorAtenuacion * fIntX + fColX,
    fy: fObjY + factorAtenuacion * fIntY + fColY
  };
}

// ============================================================================
// 4. ESTADO DE SIMULACIÓN, RENDERIZADO Y CONTROLES
// ============================================================================
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const canvasBox = document.getElementById('canvasBox');

const nSlider = document.getElementById('nSlider');
const rSlider = document.getElementById('rSlider');
const nBadge = document.getElementById('nBadge');
const rBadge = document.getElementById('rBadge');
const resetBtn = document.getElementById('resetBtn');

let swarms = [];
let simTime = 0;
let isDraggingGoal = false;

const PIXELS_PER_METER = 38;
const R_ROBOT = 0.25;
const V_MAX = 1.85;

function updateSliderFill(slider) {
  const min = parseFloat(slider.min);
  const max = parseFloat(slider.max);
  const val = parseFloat(slider.value);
  const pct = ((val - min) / (max - min)) * 100;
  slider.style.background = `linear-gradient(to right, #f39c12 0%, #f39c12 ${pct}%, #3a3940 ${pct}%, #3a3940 100%)`;
}

function worldToScreen(wx, wy) {
  return {
    x: canvas.width / 2 + wx * PIXELS_PER_METER,
    y: canvas.height / 2 - wy * PIXELS_PER_METER
  };
}

function screenToWorld(sx, sy) {
  return {
    x: (sx - canvas.width / 2) / PIXELS_PER_METER,
    y: (canvas.height / 2 - sy) / PIXELS_PER_METER
  };
}

function createSwarm(id, color, startX, startY, goalX, goalY, count) {
  const agents = [];
  for (let i = 0; i < count; i++) {
    const angle = (2 * Math.PI * i) / count + 0.3;
    const rad = count === 1 ? 0 : 0.45 + (i % 3) * 0.22;
    agents.push({
      x: startX + Math.cos(angle) * rad,
      y: startY + Math.sin(angle) * rad,
      vx: 0,
      vy: 0,
      goal: { x: goalX, y: goalY },
      trail: []
    });
  }
  return { id, color, goal: { x: goalX, y: goalY }, agents };
}

function initSimulation() {
  canvas.width = canvasBox.clientWidth;
  canvas.height = canvasBox.clientHeight;
  simTime = 0;

  const n = parseInt(nSlider.value, 10);

  swarms = [
    createSwarm(1, '#8ab4f8', -7.2, -3.6, 7.2, 3.6, n),
    createSwarm(2, '#f48fb1', 7.2, -3.6, -7.2, 3.6, n),
    createSwarm(3, '#81c995', 0, 4.8, 0, -4.8, n)
  ];
}

function stepPhysics(dt) {
  const params = {
    dFormacion: 0.95,
    rSensor: parseFloat(rSlider.value)
  };

  const computed = [];
  for (let s = 0; s < swarms.length; s++) {
    computed[s] = [];
    for (let a = 0; a < swarms[s].agents.length; a++) {
      computed[s][a] = calcularFuerzasAgente(swarms[s].agents[a], swarms[s], swarms, params);
    }
  }

  for (let s = 0; s < swarms.length; s++) {
    for (let a = 0; a < swarms[s].agents.length; a++) {
      const ag = swarms[s].agents[a];
      const f = computed[s][a];

      ag.vx += f.fx * dt;
      ag.vy += f.fy * dt;

      const speed = Math.hypot(ag.vx, ag.vy);
      if (speed > V_MAX) {
        ag.vx = (ag.vx / speed) * V_MAX;
        ag.vy = (ag.vy / speed) * V_MAX;
      }

      ag.x += ag.vx * dt;
      ag.y += ag.vy * dt;

      if (Math.floor(simTime * 30) % 2 === 0) {
        ag.trail.push({ x: ag.x, y: ag.y });
        if (ag.trail.length > 42) ag.trail.shift();
      }
    }
  }

  simTime += dt;
}

function drawScene() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. Cuadrícula de fondo (1 metro por celda)
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
  ctx.lineWidth = 1;
  const step = PIXELS_PER_METER;
  for (let x = (canvas.width / 2) % step; x < canvas.width; x += step) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = (canvas.height / 2) % step; y < canvas.height; y += step) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  const rSensorPx = parseFloat(rSlider.value) * PIXELS_PER_METER;

  // 2. Dibujar enjambres
  for (const swarm of swarms) {
    if (swarm.agents.length > 0) {
      const leaderPos = worldToScreen(swarm.agents[0].x, swarm.agents[0].y);
      ctx.save();
      ctx.fillStyle = swarm.color + '12';
      ctx.strokeStyle = swarm.color + '40';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(leaderPos.x, leaderPos.y, rSensorPx, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    for (const ag of swarm.agents) {
      if (ag.trail.length > 1) {
        ctx.strokeStyle = swarm.color + '45';
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        const p0 = worldToScreen(ag.trail[0].x, ag.trail[0].y);
        ctx.moveTo(p0.x, p0.y);
        for (let k = 1; k < ag.trail.length; k++) {
          const pk = worldToScreen(ag.trail[k].x, ag.trail[k].y);
          ctx.lineTo(pk.x, pk.y);
        }
        ctx.stroke();
      }
    }

    const gPos = worldToScreen(swarm.goal.x, swarm.goal.y);
    ctx.strokeStyle = swarm.color + 'cc';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(gPos.x, gPos.y, 11, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(gPos.x - 5, gPos.y); ctx.lineTo(gPos.x + 5, gPos.y);
    ctx.moveTo(gPos.x, gPos.y - 5); ctx.lineTo(gPos.x, gPos.y + 5);
    ctx.stroke();

    const rPx = Math.max(7, R_ROBOT * PIXELS_PER_METER);
    for (const ag of swarm.agents) {
      const pos = worldToScreen(ag.x, ag.y);
      ctx.fillStyle = swarm.color;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, rPx, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#121316';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }
}

function animate() {
  stepPhysics(0.025);
  drawScene();
  requestAnimationFrame(animate);
}

// ============================================================================
// 5. EVENTOS DE INTERFAZ Y ARRASTRE DE META AZUL
// ============================================================================
nSlider.addEventListener('input', () => {
  nBadge.textContent = nSlider.value;
  updateSliderFill(nSlider);
  initSimulation();
});

rSlider.addEventListener('input', () => {
  rBadge.textContent = `${parseFloat(rSlider.value).toFixed(1)} m`;
  updateSliderFill(rSlider);
});

resetBtn.addEventListener('click', initSimulation);

function updateBlueGoalFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  const sx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const sy = (e.clientY - rect.top) * (canvas.height / rect.height);
  const world = screenToWorld(sx, sy);
  if (swarms.length > 0) {
    swarms[0].goal = world;
    swarms[0].agents.forEach(ag => ag.goal = world);
  }
}

canvas.addEventListener('mousedown', (e) => {
  isDraggingGoal = true;
  updateBlueGoalFromEvent(e);
});

window.addEventListener('mousemove', (e) => {
  if (isDraggingGoal) updateBlueGoalFromEvent(e);
});

window.addEventListener('mouseup', () => {
  isDraggingGoal = false;
});

window.addEventListener('resize', () => {
  canvas.width = canvasBox.clientWidth;
  canvas.height = canvasBox.clientHeight;
});

updateSliderFill(nSlider);
updateSliderFill(rSlider);
initSimulation();
animate();
</script>
</body>
</html>
