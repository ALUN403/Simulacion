<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad STEM EV3: Lógica Reactiva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos base y configuración de pantalla completa sin scroll */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #141417;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Contenedor principal centrado con tamaño fijo de bloque (como en la imagen) */
        #stage-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
        }

        /* Grupo de interfaz + pista de tamaño fijo */
        #app-layout {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 14px;
            max-width: 100%;
            max-height: 100%;
        }

        /* Panel lateral izquierdo con dimensiones fijas */
        #ui-panel {
            position: relative;
            flex-shrink: 0;
            width: 315px;
            background: #282831;
            border: 1px solid rgba(243, 156, 18, 0.35);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
            z-index: 10;
            box-sizing: border-box;
        }

        /* Cuando el usuario arrastra el panel manualmente, pasa a modo flotante */
        #ui-panel.floating {
            position: fixed;
            margin: 0;
        }

        /* Contenedor de la arena de tamaño fijo */
        #arena-wrapper {
            position: relative;
            flex-shrink: 0;
            width: 760px;
            height: 550px;
            max-width: calc(100vw - 365px);
            max-height: calc(100vh - 32px);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #141417;
            border: 1.5px solid rgba(243, 156, 18, 0.65);
            border-radius: 12px;
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.65), inset 0 0 24px rgba(0, 0, 0, 0.45);
            touch-action: none; /* Evita scroll o zoom al arrastrar en pantallas táctiles */
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            font-size: 1.15rem;
            font-weight: 600;
            border-bottom: 1px solid rgba(243, 156, 18, 0.35);
            padding-bottom: 12px;
            margin-bottom: 18px;
            color: #f39c12;
            cursor: grab;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        h2:active {
            cursor: grabbing;
        }

        .drag-grip {
            display: inline-flex;
            align-items: center;
            color: rgba(243, 156, 18, 0.7);
            flex-shrink: 0;
        }

        .control-group {
            margin-bottom: 18px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: #ecf0f1;
        }

        /* Estilizado personalizado de sliders */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 4px;
            background: linear-gradient(to right, #f39c12 0%, #f39c12 var(--progress, 50%), #52525b var(--progress, 50%), #52525b 100%);
            outline: none;
            cursor: pointer;
            margin-top: 4px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #f39c12;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border: none;
            border-radius: 50%;
            background: #f39c12;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
        }

        .desc {
            font-size: 0.72rem;
            color: #9ca3af;
            display: block;
            margin-top: -4px;
            margin-bottom: 8px;
        }

        #stats-board {
            margin-top: 22px;
            padding: 18px 14px;
            background: #1b1b20;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(231, 76, 60, 0.35);
        }

        .stat-value {
            font-size: 2.2rem;
            color: #e74c3c;
            font-weight: 700;
            line-height: 1.1;
        }

        .stat-label {
            font-size: 0.76rem;
            color: #d1d5db;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-top: 6px;
        }

        button.btn-reset {
            width: 100%;
            padding: 12px;
            margin-top: 16px;
            background: #f39c12;
            color: #141417;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button.btn-reset:hover {
            background: #e67e22;
        }

        button.btn-reset:active {
            transform: scale(0.99);
        }
    </style>
</head>
<body>
    <div id="stage-container">
        <div id="app-layout">
            <!-- Panel de control y telemetría STEM -->
            <aside id="ui-panel" aria-label="Controles de simulación EV3">
                <h2 id="ui-panel-header" title="Arrastra para mover este panel">
                    <span>Arquitectura Reactiva EV3</span>
                    <span class="drag-grip" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <circle cx="5" cy="3.5" r="1.2"/>
                            <circle cx="11" cy="3.5" r="1.2"/>
                            <circle cx="5" cy="8" r="1.2"/>
                            <circle cx="11" cy="8" r="1.2"/>
                            <circle cx="5" cy="12.5" r="1.2"/>
                            <circle cx="11" cy="12.5" r="1.2"/>
                        </svg>
                    </span>
                </h2>

                <div class="control-group">
                    <label for="slider-robots">
                        <span>Robots en Prueba</span>
                        <span id="val-robots">2</span>
                    </label>
                    <input type="range" id="slider-robots" min="1" max="5" step="1" value="2">
                </div>

                <div class="control-group">
                    <label for="slider-sensor">
                        <span>Rango del Ultrasónico</span>
                        <span id="val-sensor">70px</span>
                    </label>
                    <span class="desc">Distancia umbral para activar el desvío.</span>
                    <input type="range" id="slider-sensor" min="30" max="70" step="1" value="70">
                </div>

                <div class="control-group">
                    <label for="slider-vel">
                        <span>Velocidad de Motores</span>
                        <span id="val-vel">3.0</span>
                    </label>
                    <input type="range" id="slider-vel" min="1" max="3" step="0.1" value="3">
                </div>

                <div id="stats-board">
                    <div class="stat-value" id="val-colisiones">0</div>
                    <div class="stat-label">Colisiones Registradas</div>
                </div>

                <button type="button" class="btn-reset" id="btn-reiniciar" onclick="reiniciarPrueba()">
                    Reiniciar Experimento
                </button>

                <p class="text-[0.72rem] text-[#9ca3af] text-center mt-4 mb-0 leading-relaxed">
                    Arrastra los círculos (obstáculos) dentro de la pista para reorganizar la arena.
                </p>
            </aside>

            <!-- Arena delimitada de tamaño fijo -->
            <main id="arena-wrapper" aria-label="Pista de simulación">
                <canvas id="simCanvas" width="760" height="550"></canvas>
            </main>
        </div>
    </div>

    <script>
        // Referencias al canvas y contexto 2D
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Dimensiones lógicas constantes de la arena
        const ARENA_WIDTH = 760;
        const ARENA_HEIGHT = 550;

        // Referencias a elementos de interfaz
        const uiPanel = document.getElementById('ui-panel');
        const uiPanelHeader = document.getElementById('ui-panel-header');
        const sliderRobots = document.getElementById('slider-robots');
        const sliderSensor = document.getElementById('slider-sensor');
        const sliderVel = document.getElementById('slider-vel');
        const valRobots = document.getElementById('val-robots');
        const valSensor = document.getElementById('val-sensor');
        const valVel = document.getElementById('val-vel');
        const valColisiones = document.getElementById('val-colisiones');

        // Parámetros configurables de la simulación
        let numRobots = 2;
        let sensorRange = 70;
        let baseSpeed = 3.0;
        let totalColisiones = 0;

        // Estado de entidades en la arena
        let obstaculos = [];
        let robots = [];
        let efectosColision = [];
        let objetoArrastrado = null;

        // Estado para el arrastre opcional de la ventana de parámetros (#ui-panel)
        let arrastrandoPanel = false;
        let offsetPanelX = 0;
        let offsetPanelY = 0;

        /**
         * Actualiza el relleno naranja visual de los sliders según su valor actual.
         */
        function actualizarProgresoSlider(slider) {
            const min = parseFloat(slider.min);
            const max = parseFloat(slider.max);
            const val = parseFloat(slider.value);
            const pct = ((val - min) / (max - min)) * 100;
            slider.style.setProperty('--progress', pct + '%');
        }

        [sliderRobots, sliderSensor, sliderVel].forEach(actualizarProgresoSlider);

        /**
         * Mantiene el panel flotante de parámetros dentro de los límites visibles de la ventana.
         */
        function limitarPosicionPanel(left, top) {
            if (!uiPanel.classList.contains('floating')) return;
            const margin = 10;
            const maxLeft = Math.max(margin, window.innerWidth - uiPanel.offsetWidth - margin);
            const maxTop = Math.max(margin, window.innerHeight - uiPanel.offsetHeight - margin);
            uiPanel.style.left = Math.min(Math.max(margin, left), maxLeft) + 'px';
            uiPanel.style.top = Math.min(Math.max(margin, top), maxTop) + 'px';
        }

        function iniciarArrastrePanel(clientX, clientY) {
            const rect = uiPanel.getBoundingClientRect();
            if (!uiPanel.classList.contains('floating')) {
                uiPanel.classList.add('floating');
                uiPanel.style.width = rect.width + 'px';
                uiPanel.style.left = rect.left + 'px';
                uiPanel.style.top = rect.top + 'px';
            }
            arrastrandoPanel = true;
            offsetPanelX = clientX - rect.left;
            offsetPanelY = clientY - rect.top;
            uiPanelHeader.style.cursor = 'grabbing';
        }

        function moverArrastrePanel(clientX, clientY) {
            if (!arrastrandoPanel) return;
            limitarPosicionPanel(clientX - offsetPanelX, clientY - offsetPanelY);
        }

        function finalizarArrastrePanel() {
            if (!arrastrandoPanel) return;
            arrastrandoPanel = false;
            uiPanelHeader.style.cursor = 'grab';
        }

        uiPanelHeader.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            iniciarArrastrePanel(e.clientX, e.clientY);
        });
        window.addEventListener('mousemove', (e) => moverArrastrePanel(e.clientX, e.clientY));
        window.addEventListener('mouseup', finalizarArrastrePanel);

        uiPanelHeader.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                iniciarArrastrePanel(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });
        window.addEventListener('touchmove', (e) => {
            if (arrastrandoPanel && e.touches.length > 0) {
                e.preventDefault();
                moverArrastrePanel(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });
        window.addEventListener('touchend', finalizarArrastrePanel);
        window.addEventListener('touchcancel', finalizarArrastrePanel);

        /**
         * Mantiene las dimensiones internas fijas de la pista para que nunca cambie de tamaño.
         */
        function resize() {
            canvas.width = ARENA_WIDTH;
            canvas.height = ARENA_HEIGHT;

            if (uiPanel.classList.contains('floating')) {
                const rectPanel = uiPanel.getBoundingClientRect();
                limitarPosicionPanel(rectPanel.left, rectPanel.top);
            }
        }

        /**
         * Ajusta el número de robots activos en la pista sin reiniciar obstáculos ni colisiones.
         */
        function ajustarCantidadRobots(nuevaCantidad) {
            numRobots = nuevaCantidad;
            valRobots.innerText = numRobots;
            if (robots.length < numRobots) {
                for (let i = robots.length; i < numRobots; i++) {
                    robots.push(new RobotReactivo(i));
                }
            } else if (robots.length > numRobots) {
                robots.length = numRobots;
            }
        }

        // Listeners de controles deslizantes
        sliderRobots.addEventListener('input', (e) => {
            actualizarProgresoSlider(e.target);
            ajustarCantidadRobots(parseInt(e.target.value, 10));
        });
        sliderSensor.addEventListener('input', (e) => {
            actualizarProgresoSlider(e.target);
            sensorRange = parseInt(e.target.value, 10);
            valSensor.innerText = sensorRange + 'px';
        });
        sliderVel.addEventListener('input', (e) => {
            actualizarProgresoSlider(e.target);
            baseSpeed = parseFloat(e.target.value);
            valVel.innerText = baseSpeed.toFixed(1);
        });

        /**
         * Genera los 6 obstáculos circulares en las posiciones y tamaños relativos exactos de referencia.
         */
        function generarObstaculos() {
            const configuracionObstaculos = [
                { x: 0.335 * ARENA_WIDTH, y: 0.20 * ARENA_HEIGHT,  radius: 28 }, // 1. Superior izquierda
                { x: 0.51 * ARENA_WIDTH,  y: 0.37 * ARENA_HEIGHT,  radius: 28 }, // 2. Central superior
                { x: 0.685 * ARENA_WIDTH, y: 0.29 * ARENA_HEIGHT,  radius: 24 }, // 3. Superior derecha
                { x: 0.333 * ARENA_WIDTH, y: 0.59 * ARENA_HEIGHT,  radius: 28 }, // 4. Inferior izquierda
                { x: 0.495 * ARENA_WIDTH, y: 0.725 * ARENA_HEIGHT, radius: 34 }, // 5. Inferior central (más grande)
                { x: 0.635 * ARENA_WIDTH, y: 0.74 * ARENA_HEIGHT,  radius: 24 }  // 6. Inferior derecha
            ];

            obstaculos = configuracionObstaculos.map((obs) => ({
                x: obs.x,
                y: obs.y,
                radius: obs.radius,
                isDragging: false
            }));
        }

        /**
         * Clase que modela un robot EV3 con arquitectura de control reactivo basada en sensor ultrasónico.
         */
        class RobotReactivo {
            constructor(id) {
                this.id = id;
                this.radius = 12;
                this.x = 30 + Math.random() * (ARENA_WIDTH - 60);
                this.y = 30 + Math.random() * (ARENA_HEIGHT - 60);
                this.angle = Math.random() * Math.PI * 2;
                this.tasaGiroAleatorio = (Math.random() - 0.5) * 0.04;
                this.pasosRestantesRumbo = 20 + Math.floor(Math.random() * 50);
                this.estado = 0; // 0 = explorar aleatoriamente, 1 = esquivar
                this.direccionEsquive = 1; // 1 = horario, -1 = antihorario
                this.tiempoEsquive = 0;
                this.cooldownColision = 0;
                this.color = '#00a8ff';
            }

            /**
             * Normaliza un ángulo en radianes al rango [-PI, PI].
             */
            normalizarAngulo(rad) {
                return Math.atan2(Math.sin(rad), Math.cos(rad));
            }

            /**
             * Actualiza percepción sensorial, toma de decisión reactiva, cinemática y colisiones.
             */
            update(todosRobots) {
                let obstaculoEnFrente = false;
                let distMinima = sensorRange;
                const medioCono = 0.45; // ~25.8 grados a cada lado del eje frontal

                // Evalúa si un objeto circular entra en el cono frontal del sensor ultrasónico
                const checarRayo = (objX, objY, objRadio) => {
                    const dx = objX - this.x;
                    const dy = objY - this.y;
                    const distSuperficie = Math.hypot(dx, dy) - this.radius - objRadio;

                    if (distSuperficie < sensorRange) {
                        const anguloHaciaObj = Math.atan2(dy, dx);
                        const diffAngulo = this.normalizarAngulo(this.angle - anguloHaciaObj);

                        if (Math.abs(diffAngulo) < medioCono) {
                            obstaculoEnFrente = true;
                            if (distSuperficie < distMinima) {
                                distMinima = distSuperficie;
                            }
                            if (this.estado === 0) {
                                // Gira en sentido opuesto al lado en que percibe el obstáculo
                                this.direccionEsquive = diffAngulo > 0 ? 1 : -1;
                            }
                        }
                    }
                };

                // Sensado de obstáculos arrastrables
                for (let i = 0; i < obstaculos.length; i++) {
                    checarRayo(obstaculos[i].x, obstaculos[i].y, obstaculos[i].radius);
                }

                // Sensado de otros robots en la arena
                for (let i = 0; i < todosRobots.length; i++) {
                    const rob = todosRobots[i];
                    if (rob.id !== this.id) {
                        checarRayo(rob.x, rob.y, rob.radius);
                    }
                }

                // Transición de estados reactivos
                if (obstaculoEnFrente) {
                    this.estado = 1;
                    this.tiempoEsquive = 20;
                } else if (this.tiempoEsquive > 0) {
                    this.tiempoEsquive--;
                } else {
                    this.estado = 0;
                }

                // Ejecución de comportamiento según estado activo
                if (this.estado === 1) {
                    this.angle = this.normalizarAngulo(this.angle + 0.08 * this.direccionEsquive);
                    this.x += Math.cos(this.angle) * (baseSpeed * 0.3);
                    this.y += Math.sin(this.angle) * (baseSpeed * 0.3);
                } else {
                    if (this.pasosRestantesRumbo <= 0) {
                        this.pasosRestantesRumbo = 20 + Math.floor(Math.random() * 60);
                        this.tasaGiroAleatorio = (Math.random() - 0.5) * 0.05;
                    } else {
                        this.tasaGiroAleatorio += (Math.random() - 0.5) * 0.008;
                        this.tasaGiroAleatorio = Math.max(-0.05, Math.min(0.05, this.tasaGiroAleatorio));
                        this.pasosRestantesRumbo--;
                    }

                    this.angle = this.normalizarAngulo(this.angle + this.tasaGiroAleatorio);
                    this.x += Math.cos(this.angle) * baseSpeed;
                    this.y += Math.sin(this.angle) * baseSpeed;
                }

                // Reducción de cooldown de colisiones
                if (this.cooldownColision > 0) {
                    this.cooldownColision--;
                }

                // Detección física de colisión, aplicación de repulsión y registro de impacto
                const checarColision = (objX, objY, objRadio) => {
                    const dx = this.x - objX;
                    const dy = this.y - objY;
                    const dist = Math.hypot(dx, dy);
                    const umbralColision = this.radius + objRadio - 2;

                    if (dist < umbralColision) {
                        if (this.cooldownColision === 0) {
                            totalColisiones++;
                            valColisiones.innerText = totalColisiones;
                            this.cooldownColision = 30;
                            efectosColision.push({
                                x: this.x + (objX - this.x) / 2,
                                y: this.y + (objY - this.y) / 2,
                                life: 1.0
                            });
                        }

                        if (dist > 0.0001) {
                            this.x += (dx / dist) * 2;
                            this.y += (dy / dist) * 2;
                        } else {
                            this.x += 2;
                        }
                    }
                };

                // Colisiones con obstáculos
                for (let i = 0; i < obstaculos.length; i++) {
                    checarColision(obstaculos[i].x, obstaculos[i].y, obstaculos[i].radius);
                }

                // Colisiones entre pares de robots (evita duplicar por par usando rob.id > this.id)
                for (let i = 0; i < todosRobots.length; i++) {
                    const rob = todosRobots[i];
                    if (rob.id !== this.id && rob.id > this.id) {
                        checarColision(rob.x, rob.y, rob.radius);
                    }
                }

                // Contención y rebote suave en los bordes de la pista
                let rebotoEnBorde = false;
                if (this.x < this.radius + 6) {
                    this.x = this.radius + 6;
                    rebotoEnBorde = true;
                } else if (this.x > ARENA_WIDTH - this.radius - 6) {
                    this.x = ARENA_WIDTH - this.radius - 6;
                    rebotoEnBorde = true;
                }

                if (this.y < this.radius + 6) {
                    this.y = this.radius + 6;
                    rebotoEnBorde = true;
                } else if (this.y > ARENA_HEIGHT - this.radius - 6) {
                    this.y = ARENA_HEIGHT - this.radius - 6;
                    rebotoEnBorde = true;
                }

                if (rebotoEnBorde) {
                    const anguloCentro = Math.atan2(ARENA_HEIGHT / 2 - this.y, ARENA_WIDTH / 2 - this.x);
                    this.angle = this.normalizarAngulo(anguloCentro + (Math.random() - 0.5) * 0.8);
                    this.pasosRestantesRumbo = 25 + Math.floor(Math.random() * 40);
                }
            }

            /**
             * Dibuja el cono ultrasónico (verde en exploración, rojo en evasión) y el cuerpo del robot.
             */
            draw() {
                // Cono del sensor ultrasónico
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.arc(this.x, this.y, sensorRange, this.angle - 0.45, this.angle + 0.45);
                ctx.lineTo(this.x, this.y);
                ctx.fillStyle = this.estado === 1
                    ? 'rgba(231, 76, 60, 0.16)'
                    : 'rgba(46, 204, 113, 0.06)';
                ctx.fill();

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Sombra suave del chasis
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetX = -2;
                ctx.shadowOffsetY = 3;

                // Cuerpo circular azul vibrante
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();

                // Borde blanco grueso
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                // Desactivar sombra para detalles internos
                ctx.shadowColor = 'transparent';

                // Línea direccional interna
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(this.radius, 0);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                // Antena / indicador frontal
                ctx.beginPath();
                ctx.arc(this.radius + 2, 0, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                ctx.restore();
            }
        }

        /**
         * Reinicia el experimento completo: obstáculos, robots y contador de colisiones.
         */
        function reiniciarPrueba() {
            try {
                robots = [];
                totalColisiones = 0;
                valColisiones.innerText = 0;
                efectosColision = [];
                objetoArrastrado = null;

                resize();
                generarObstaculos();

                for (let i = 0; i < numRobots; i++) {
                    robots.push(new RobotReactivo(i));
                }
            } catch (err) {
                console.error('Error al reiniciar la prueba:', err);
            }
        }

        // Soporte para arrastrar obstáculos con mouse y táctil
        function iniciarArrastre(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const mX = (clientX - rect.left) * (ARENA_WIDTH / rect.width);
            const mY = (clientY - rect.top) * (ARENA_HEIGHT / rect.height);

            for (let i = 0; i < obstaculos.length; i++) {
                const obs = obstaculos[i];
                if (Math.hypot(mX - obs.x, mY - obs.y) <= obs.radius) {
                    objetoArrastrado = obs;
                    return;
                }
            }
        }

        function moverArrastre(clientX, clientY) {
            if (!objetoArrastrado) return;
            const rect = canvas.getBoundingClientRect();
            const mX = (clientX - rect.left) * (ARENA_WIDTH / rect.width);
            const mY = (clientY - rect.top) * (ARENA_HEIGHT / rect.height);

            objetoArrastrado.x = Math.min(Math.max(objetoArrastrado.radius, mX), ARENA_WIDTH - objetoArrastrado.radius);
            objetoArrastrado.y = Math.min(Math.max(objetoArrastrado.radius, mY), ARENA_HEIGHT - objetoArrastrado.radius);
        }

        function finalizarArrastre() {
            objetoArrastrado = null;
        }

        canvas.addEventListener('mousedown', (e) => iniciarArrastre(e.clientX, e.clientY));
        canvas.addEventListener('mousemove', (e) => moverArrastre(e.clientX, e.clientY));
        window.addEventListener('mouseup', finalizarArrastre);

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                iniciarArrastre(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (objetoArrastrado && e.touches.length > 0) {
                e.preventDefault();
                moverArrastre(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        window.addEventListener('touchend', finalizarArrastre);
        window.addEventListener('touchcancel', finalizarArrastre);

        /**
         * Bucle principal de renderizado y actualización de la simulación.
         */
        function animate() {
            try {
                // Fondo delimitado de la pista
                ctx.fillStyle = '#141417';
                ctx.fillRect(0, 0, ARENA_WIDTH, ARENA_HEIGHT);

                // Dibujar cuadrícula sutil de referencia dentro de la pista
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
                ctx.lineWidth = 1;
                const pasoCuadricula = 40;
                for (let x = pasoCuadricula; x < ARENA_WIDTH; x += pasoCuadricula) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, ARENA_HEIGHT);
                    ctx.stroke();
                }
                for (let y = pasoCuadricula; y < ARENA_HEIGHT; y += pasoCuadricula) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(ARENA_WIDTH, y);
                    ctx.stroke();
                }

                // Dibujar obstáculos circulares
                for (let i = 0; i < obstaculos.length; i++) {
                    const obs = obstaculos[i];
                    ctx.beginPath();
                    ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#334155';
                    ctx.fill();
                    ctx.strokeStyle = '#94a3b8';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                // Actualizar y dibujar robots reactivos
                for (let i = 0; i < robots.length; i++) {
                    robots[i].update(robots);
                    robots[i].draw();
                }

                // Dibujar y desvanecer destellos rojos de colisión
                for (let i = efectosColision.length - 1; i >= 0; i--) {
                    const ef = efectosColision[i];
                    ctx.beginPath();
                    ctx.arc(ef.x, ef.y, 10 + (1 - ef.life) * 20, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(231, 76, 60, ${ef.life})`;
                    ctx.fill();
                    ef.life -= 0.05;
                    if (ef.life <= 0) {
                        efectosColision.splice(i, 1);
                    }
                }
            } catch (err) {
                console.error('Error en el ciclo de animación:', err);
            }

            requestAnimationFrame(animate);
        }

        // Inicialización de la simulación
        window.addEventListener('resize', resize);
        window.onload = function () {
            reiniciarPrueba();
            animate();
        };
    </script>
</body>
